# Cloudflare Pages Functions 配置文件
# 本地开发用（wrangler dev）
# 部署到 Cloudflare Pages 时，在控制台绑定 KV 即可，无需此文件

name = "ai-nav-functions"
compatibility_date = "2024-05-01"
compatibility_flags = ["nodejs_compat"]

# KV 存储命名空间绑定
# 本地开发时需要先创建 KV 命名空间：
#   npx wrangler kv namespace create "AI_NAV_KV"
#   npx wrangler kv namespace create "AI_NAV_KV" --preview
# 然后把 ID 填入下面的 id / preview_id

[[kv_namespaces]]
binding = "AI_NAV_KV"
id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"       # 生产环境 KV ID（替换）
preview_id = "yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy" # 预览环境 KV ID（替换）

# 本地开发端口
[dev]
port = 8787
local = true
